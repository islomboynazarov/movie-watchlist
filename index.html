<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Watchlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 Movie Watchlist</h1>
    <form id="search-form">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search movies... (e.g. batman, inception)" 
        required>
      <button type="submit">Search</button>
    </form>
  </header>

  <div class="container">
    <!-- Search Results -->
    <section class="results">
      <h2>Search Results</h2>
      <div id="results-container" class="movie-grid">
        <!-- Movies will be injected here by JS -->
      </div>
    </section>

    <!-- My Watchlist -->
    <section class="watchlist">
      <h2>My Watchlist <span id="watchlist-count">(0)</span></h2>
      <div id="watchlist-container" class="movie-grid">
        <!-- Watchlist movies will be injected here by JS -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
